<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talia — Assistante commerciale ElectroCI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%2314161F%22/><path d=%22M9 3 5 13h5l-1 8 8-12h-5l2-6z%22 fill=%22%23E3A857%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
        <rect width="40" height="40" rx="10" fill="#1C1F2E"/>
        <path class="brand__bolt" d="M20 7 L11 22 H18 L16 33 L29 16 H21 L23 7 Z"
              fill="none" stroke="#E3A857" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <div class="brand__text">
        <h1>Talia</h1>
        <p>Assistante commerciale IA · ElectroCI</p>
      </div>
    </div>
    <div class="status">
      <span class="status__dot" aria-hidden="true"></span>
      <span>en ligne</span>
    </div>
  </header>

  <main class="thread" id="thread" aria-live="polite">
    <!-- Les messages sont injectés ici par app.js -->
  </main>

  <div class="typing" id="typing" hidden>
    <span></span><span></span><span></span>
  </div>

  <form class="composer" id="composer">
    <input
      id="messageInput"
      type="text"
      placeholder="Écris ta demande — ex: « je cherche un panneau solaire »"
      autocomplete="off"
      required
    />
    <button type="submit" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <path d="M3 11.5 20 4l-6 17-3.5-7.5L3 11.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </form>
</div>

<div class="modal" id="paymentModal" hidden>
  <div class="modal__card">
    <h2>Finaliser la commande</h2>
    <p class="modal__product" id="modalProductName"></p>
    <p class="modal__amount" id="modalAmount"></p>

    <label class="field">
      <span>Quantité</span>
      <input type="number" id="modalQuantity" min="1" value="1" />
    </label>

    <fieldset class="providers" id="modalProviders">
      <legend>Moyen de paiement</legend>
      <label class="provider provider--wave">
        <input type="radio" name="provider" value="wave" checked />
        <span>Wave</span>
      </label>
      <label class="provider provider--om">
        <input type="radio" name="provider" value="orange_money" />
        <span>Orange Money</span>
      </label>
      <label class="provider provider--momo">
        <input type="radio" name="provider" value="mtn_momo" />
        <span>MTN MoMo</span>
      </label>
    </fieldset>

    <label class="field">
      <span>Numéro de téléphone</span>
      <input type="tel" id="modalPhone" placeholder="07 XX XX XX XX" required />
    </label>

    <div class="modal__actions">
      <button type="button" class="btn btn--ghost" id="modalCancel">Annuler</button>
      <button type="button" class="btn btn--primary" id="modalConfirm">Confirmer le paiement</button>
    </div>
    <p class="modal__note">Simulation — aucun compte n'est débité.</p>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
